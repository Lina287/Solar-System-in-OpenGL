<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#b7b7b7"/>
  <rect x="0" y="0" width="1280" height="40" fill="#d9d9d9" stroke="#aaa"/>
  <text x="8" y="24" font-family="Arial" font-size="12" fill="#333">SolarSystem</text>
  <rect x="70" y="250" width="1140" height="250" fill="none" stroke="none"/>

  <!-- Orbit rings -->
  <ellipse cx="640" cy="360" rx="550" ry="122" fill="none" stroke="#141414" stroke-width="2" stroke-dasharray="1 3"/>
  <ellipse cx="640" cy="360" rx="480" ry="112" fill="none" stroke="#3a2d9c" stroke-width="2" stroke-dasharray="1 3"/>
  <ellipse cx="640" cy="360" rx="400" ry="104" fill="none" stroke="#00a040" stroke-width="2" stroke-dasharray="1 3"/>
  <ellipse cx="640" cy="360" rx="330" ry="96" fill="none" stroke="#efb500" stroke-width="2" stroke-dasharray="1 3"/>
  <ellipse cx="640" cy="360" rx="270" ry="82" fill="none" stroke="#e31313" stroke-width="2" stroke-dasharray="1 3"/>
  <ellipse cx="640" cy="360" rx="220" ry="78" fill="none" stroke="#b07a30" stroke-width="2" stroke-dasharray="1 3"/>

  <!-- Planet bodies -->
  <ellipse cx="190" cy="360" rx="24" ry="20" fill="#9e9eff" stroke="#777" stroke-width="2"/>
  <ellipse cx="290" cy="420" rx="28" ry="24" fill="#50cfcc" stroke="#fff" stroke-width="1"/>
  <ellipse cx="644" cy="350" rx="72" ry="42" fill="#ff0000" stroke="#fff" stroke-width="2"/>
  <ellipse cx="800" cy="210" rx="55" ry="38" fill="#e6e3a2" stroke="#000" stroke-width="1" opacity="0.95"/>
  <ellipse cx="890" cy="320" rx="24" ry="20" fill="#efb700" stroke="#000" stroke-width="1"/>

  <!-- Main sun -->
  <circle cx="640" cy="360" r="38" fill="#f5f5de" stroke="#ffe97f" stroke-width="2"/>

  <!-- Orbit center label not necessary -->
</svg>
